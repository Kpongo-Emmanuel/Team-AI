<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multi-Agent Development Suite</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; gap: 20px; box-sizing: border-box; }
        .panel { background: #1e1e1e; padding: 20px; border-radius: 8px; flex: 1; display: flex; flex-direction: column; gap: 15px; }
        #chat { height: 420px; overflow-y: auto; background: #000; padding: 12px; border-radius: 6px; border: 1px solid #333; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 4px; font-size: 14px; line-height: 1.4; }
        .system { color: #888; font-style: italic; background: #181818; }
        .chat-entry { background: #2a2a2a; border-left: 4px solid #00bcd4; }
        .agent-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #252525; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        input, textarea, button { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: #00bcd4; outline: none; }
        button { background: #00bcd4; color: #000; font-weight: bold; cursor: pointer; border: none; transition: background 0.2s; }
        button:hover { background: #00acc1; }
    </style>
</head>
<body>

<div class="panel">
    <h2>1. Team Setup</h2>
    <div id="agent-list">
        <div class="agent-row">
            <input type="text" class="name" value="Lead Architecture" placeholder="Agent Name">
            <input type="text" class="role" value="Lead Developer / Manager" placeholder="Role">
            <input type="password" class="key" placeholder="API Key">
            <input type="text" class="endpoint" value="https://api.openai.com/v1/chat/completions" placeholder="Endpoint">
        </div>
        <div class="agent-row">
            <input type="text" class="name" value="UI/UX Specialist" placeholder="Agent Name">
            <input type="text" class="role" value="Frontend Developer" placeholder="Role">
            <input type="password" class="key" placeholder="API Key">
            <input type="text" class="endpoint" value="https://api.openai.com/v1/chat/completions" placeholder="Endpoint">
        </div>
    </div>
    
    <h2>2. Project Objective</h2>
    <textarea id="prompt" rows="3" placeholder="Describe the application or feature you want the team to build..."></textarea>
    <button onclick="startDiscussion()">Start Collaboration</button>
</div>

<div class="panel">
    <h2>Live Agent Feed</h2>
    <div id="chat"></div>
    
    <h2>Step In (Intervene)</h2>
    <div style="display: flex; gap: 8px;">
        <input type="text" id="guidance" placeholder="Inject direction, fix a logic error, or give instructions...">
        <button style="width: 150px;" onclick="stepIn()">Inject</button>
    </div>
</div>

<script>
    const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${protocol}//${window.location.host}/ws/orchestrate`;
    const ws = new WebSocket(wsUrl);
    
    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const chat = document.getElementById("chat");
        const div = document.createElement("div");
        div.className = "msg " + (data.type || "");
        
        if (data.type === "chat") {
            div.className += " chat-entry";
            div.innerHTML = `<strong>${data.agent} (${data.role}):</strong><br>${data.text}`;
        } else {
            div.innerText = data.text;
        }
        
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    };

    function startDiscussion() {
        const agentRows = document.querySelectorAll("#agent-list .agent-row");
        const agents = Array.from(agentRows).map(row => ({
            name: row.querySelector(".name").value,
            role: row.querySelector(".role").value,
            api_key: row.querySelector(".key").value,
            endpoint: row.querySelector(".endpoint").value
        }));
        
        const prompt = document.getElementById("prompt").value;
        ws.send(JSON.stringify({ action: "start", agents, prompt, rounds: 2 }));
    }

    function stepIn() {
        const guidance = document.getElementById("guidance").value;
        if (!guidance) return;
        ws.send(JSON.stringify({ action: "step_in", guidance }));
        document.getElementById("guidance").value = "";
    }
</script>

</body>
</html>
